name: Signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
      NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
      NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare owner signing key
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for secret in NOVA_KEYSTORE_BASE64 NOVA_KEYSTORE_PASSWORD NOVA_KEY_ALIAS NOVA_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Required signing secret $secret is missing"
              exit 1
            fi
          done
          NOVA_KEYSTORE_FILE="$RUNNER_TEMP/nova-release.jks"
          echo "NOVA_KEYSTORE_FILE=$NOVA_KEYSTORE_FILE" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 --decode > "$NOVA_KEYSTORE_FILE"
      - name: Validate and build
        run: ./gradlew :core:test :app:lintRelease :app:assembleRelease
      - name: Verify signature and checksum
        run: |
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nova-signed-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS
            docs/RELEASE_NOTES.md
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/nova-release.jks"
